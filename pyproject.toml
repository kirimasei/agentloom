[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloom"
version = "0.1.0"
description = "Open-source multi-agent collaboration hub, outbound worker adapters, and zero-dependency MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "AgentLoom Contributors"}]
keywords = ["mcp", "agent", "multi-agent", "websocket", "collaboration", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
hub = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]
worker = [
    "httpx>=0.27.0",
    "websockets>=13.0",
]
all = [
    "agentloom[hub,worker]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
agentloom = "agentloom.cli:main"
agentloom-mcp = "agentloom.mcp.server:main"

[project.urls]
Homepage = "https://github.com/kirimasei/agentloom"
Repository = "https://github.com/kirimasei/agentloom"
Issues = "https://github.com/kirimasei/agentloom/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentloom = ["hub/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
