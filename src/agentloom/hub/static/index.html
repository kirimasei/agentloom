}

async function createNewToken() {
  const name = document.getElementById('newTokName').value.trim();
  const role = document.getElementById('newTokRole').value;
  const rawAgents = document.getElementById('newTokAgents').value;
  const allowed = rawAgents.split(',').map(s => s.trim()).filter(Boolean);
  if (!name) {
    showToast('error', '请填写凭证名称');
    return;
  }
  try {
    const r = await apiFetch('/api/tokens', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, role, allowed_agents: allowed.length ? allowed : ['*'] })
    });
    const data = await r.json();
    if (!r.ok) {
      showToast('error', data.detail || '签发失败');
      return;
    }
    lastIssuedRecord = data;
    document.getElementById('newTokName').value = '';
    const extraBtn = data.mcp_config
      ? `<button type="button" class="icon-btn primary" onclick="copyIssuedMcp()">复制 MCP 配置 JSON</button>`
      : (data.worker_command ? `<button type="button" class="icon-btn primary" onclick="copyIssuedWorker()">复制 Worker 启动命令</button>` : '');
    document.getElementById('issuedResult').innerHTML = `
      <div class="issued-box">
        <div class="issued-title">✅ 凭证已签发（仅展示这一次，请立即保存）</div>
        <div class="issued-pre">${escapeHtml(data.token)}</div>
        <div class="issued-actions">
          <button type="button" class="icon-btn primary" onclick="copyIssuedRaw()">复制明文 Token</button>
          ${extraBtn}
        </div>
      </div>
    `;
    loadTokens();
  } catch (e) {
    showToast('error', `签发失败: ${e.message}`);
  }
}

function copyIssuedRaw() {
  if (lastIssuedRecord?.token) copyText(lastIssuedRecord.token, '已复制明文 Token');
}
function copyIssuedMcp() {
  if (lastIssuedRecord?.mcp_config) copyText(JSON.stringify(lastIssuedRecord.mcp_config, null, 2), '已复制 MCP 配置 JSON');
}
function copyIssuedWorker() {
  if (lastIssuedRecord?.worker_command) copyText(lastIssuedRecord.worker_command, '已复制 Worker 启动命令');
}

async function revokeTokenById(id) {
  try {
    const r = await apiFetch(`/api/tokens/${encodeURIComponent(id)}`, { method: 'DELETE' });
    if (r.ok) {
      showToast('info', '已吊销凭证并断开关联连接');
      loadTokens();
    } else {
      const d = await r.json();
      showToast('error', d.detail || '吊销失败');
    }
  } catch (e) {
    showToast('error', e.message);
  }
}

/* ── Thread View & Messaging ──────────────────────────────────────── */
function updateThreadHeader(data) {
  currentThreadData = data;
  currentThreadClosed = !!data.is_closed;
  document.getElementById('chatTitle').textContent = data.topic || data.id;
  document.getElementById('renameBtn').style.display = 'inline-block';
  document.getElementById('infoBtn').style.display = 'inline-flex';
  updateCloseBtn();

  const participants = (data.participants || []).map(p => {
    const prof = getNodeProfile(p, inferFallbackRole(p));
    return `<span class="p-chip" style="--node-color:${prof.color};--node-bg:${prof.bg};--node-border:${prof.border};">${escapeHtml(p)}</span>`;
  }).join('');

  const statusChip = data.is_closed
    ? '<span class="status-chip closed">已关闭</span>'
    : '<span class="status-chip open">进行中</span>';

  document.getElementById('headerSub').innerHTML = `
    <div class="participant-stack">${participants}</div>
    ${statusChip}
    <span class="sub-hint tabular">${data.round_count || 0}/${data.max_rounds || 30} 轮</span>
  `;

  const pct = Math.min(100, Math.round(((data.round_count || 0) / (data.max_rounds || 30)) * 100));
  document.getElementById('infoPopover').innerHTML = `
    <div class="pop-row">
      <span class="pop-label">线程 ID</span>
      <span class="pop-val" title="${escapeAttr(data.id)}">${escapeHtml(data.id)}</span>
    </div>
    <div class="pop-row">
      <span class="pop-label">消息总数</span>
      <span class="pop-val tabular">${data.message_count ?? 0}</span>
    </div>
    <div class="pop-row">
      <span class="pop-label">创建时间</span>
      <span class="pop-val tabular">${escapeHtml(formatRelativeTime(data.created_at))}</span>
    </div>
    <div class="pop-row">
      <span class="pop-label">最近活跃</span>
      <span class="pop-val tabular">${escapeHtml(formatRelativeTime(data.last_activity))}</span>
    </div>
    <div style="margin-top:8px;">
      <div style="display:flex;justify-content:space-between;color:var(--text-dim);font-size:11px;">
        <span>熔断轮数配额</span>
        <span class="tabular">${data.round_count || 0} / ${data.max_rounds || 30}</span>
      </div>
      <div class="round-bar"><div class="round-fill" style="width:${pct}%;"></div></div>
    </div>
    <div style="margin-top:10px;text-align:right;">
      <button class="icon-btn" onclick="copyText('${escapeAttr(data.id)}', '已复制线程 ID')">复制线程 ID</button>
    </div>
  `;
}

function toggleInfoPopover() {
  document.getElementById('infoPopover').classList.toggle('visible');
}

function startRenameThread() {
  if (!currentThread || !currentThreadData) return;
  const row = document.getElementById('titleRow');
  const prev = currentThreadData.topic || currentThreadData.id;
  row.innerHTML = `<input type="text" class="rename-input" id="renameInput" value="${escapeHtml(prev)}">`;
  const inp = document.getElementById('renameInput');
  inp.focus();
  inp.select();
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const val = inp.value.trim();
    row.innerHTML = `<h2 id="chatTitle">${escapeHtml(save && val ? val : prev)}</h2><button class="rename-trigger" id="renameBtn" onclick="startRenameThread()" title="重命名线程" style="display:inline-block;">✎</button>`;
    if (save && val && val !== prev) {
      try {
        const r = await apiFetch(`/api/threads/${encodeURIComponent(currentThread)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: val })
        });
        if (r.ok) showToast('info', '已重命名线程');
      } catch (e) {}
    }
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true), { once: true });
}

async function selectThread(threadId) {
  const seq = ++threadLoadSeq;
  pendingNewThreadFromSelf = false;
  currentThread = threadId;
  unreadCounts[threadId] = 0;
  document.getElementById('infoPopover').classList.remove('visible');
  renderThreads();
  try {
    const r = await apiFetch(`/api/threads/${encodeURIComponent(threadId)}`);
    if (!r.ok || seq !== threadLoadSeq) return;
    const data = await r.json();
    if (seq !== threadLoadSeq) return;

    updateThreadHeader(data);
    const stream = document.getElementById('chatStream');
    stream.innerHTML = '';
    hideNewMsgPill();
    (data.messages || []).forEach(m => appendMessage(m, true));
    syncWorkingIndicator();
  } catch (e) {}
}

function startNewThread() {
  threadLoadSeq++;
  pendingNewThreadFromSelf = false;
  currentThread = null;
  currentThreadData = null;
  currentThreadClosed = false;
  document.getElementById('infoPopover').classList.remove('visible');
  hideNewMsgPill();
  clearWorkingBubbles();
  renderThreads();

  document.getElementById('chatTitle').textContent = '多节点协作总览';
  document.getElementById('renameBtn').style.display = 'none';
  document.getElementById('infoBtn').style.display = 'none';
  document.getElementById('toggleCloseBtn').style.display = 'none';
  document.getElementById('headerSub').innerHTML =
    '<span class="sub-hint">选择下方快捷任务，或输入 @节点名 发起新协作线程</span>';
  renderDashboard();
}

function updateCloseBtn() {
  const btn = document.getElementById('toggleCloseBtn');
  if (!currentThread) {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'inline-flex';
  btn.textContent = currentThreadClosed ? '重开线程' : '关闭线程';
}

async function toggleThreadClosed() {
  if (!currentThread) return;
  const action = currentThreadClosed ? 'reopen' : 'close';
  const r = await apiFetch(`/api/thread/${encodeURIComponent(currentThread)}/${action}`, { method: 'POST' });
  if (r.ok) {
    currentThreadClosed = !currentThreadClosed;
    updateCloseBtn();
  }
}

function handleThreadUpdate(t) {
  if (!t || !t.id) return;
  threads[t.id] = t;
  renderThreads();
  if (t.id === currentThread) {
    updateThreadHeader(t);
  } else if (!currentThread) {
    renderDashboard();
  }
}

function handleAgentStatus(msg) {
  if (!msg.agent) return;
  if (!agents[msg.agent]) {
    agents[msg.agent] = { online: true, meta: {} };
  }
  agents[msg.agent].working = msg.state === 'working'
    ? { thread_id: msg.thread_id, detail: msg.detail || '', started_at: msg.timestamp || new Date().toISOString() }
    : null;
  if (msg.state === 'error') {
    showToast('error', `${msg.agent} 执行任务失败或超时`);
  }
  renderAgents();
  renderTopology();
  renderThreads();
  if (!currentThread) renderDashboard();
  syncWorkingIndicator();
}

function handleBroadcast(msg) {
  const prof = getNodeProfile(msg.sender, msg.role || inferFallbackRole(msg.sender));
  if (msg.sender && msg.sender !== 'system') {
    pulseNodeLink(msg.sender, prof.color);
  }
  (msg.mentions || []).forEach(m => {
    pulseNodeLink(m, getNodeProfile(m, 'agent').color);
  });

  if (!currentThread && msg.thread_id && pendingNewThreadFromSelf && msg.sender === senderName) {
    currentThread = msg.thread_id;
    pendingNewThreadFromSelf = false;
    document.getElementById('chatStream').innerHTML = '';
    updateThreadHeader(threads[msg.thread_id] || {
      id: msg.thread_id,
      topic: (msg.content || msg.thread_id).slice(0, 60),
      participants: [msg.sender],
      round_count: 1,
      max_rounds: 30,
      is_closed: false
    });
    renderThreads();
  }

  if (msg.thread_id && msg.thread_id !== currentThread) {
    unreadCounts[msg.thread_id] = (unreadCounts[msg.thread_id] || 0) + 1;
    renderThreads();
    return;
  }

  if (!currentThread) return;
  appendMessage(msg, msg.sender === senderName);
  syncWorkingIndicator();
}

function clearWorkingBubbles() {
  document.querySelectorAll('.working-bubble').forEach(el => el.remove());
  clearInterval(workingTickTimer);
  workingTickTimer = null;
}

function syncWorkingIndicator() {
  clearWorkingBubbles();
  if (!currentThread) return;
  const stream = document.getElementById('chatStream');
  const container = document.getElementById('chatMessages');
  const nearBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) < 90;

  const busy = Object.entries(agents).filter(([, info]) =>
    info.online && info.working && info.working.thread_id === currentThread
  );
  if (busy.length === 0) return;

  busy.forEach(([name, info]) => {
    const prof = getNodeProfile(name, 'agent');
    const startedMs = info.working.started_at ? new Date(info.working.started_at).getTime() : Date.now();
    const el = document.createElement('div');
    el.className = 'message agent working-bubble';
    el.style.setProperty('--node-color', prof.color);
    el.style.setProperty('--node-bg', prof.bg);
    el.style.setProperty('--node-border', prof.border);
    el.innerHTML = `
      <div class="msg-avatar">${escapeHtml(prof.mono)}</div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="msg-sender">${escapeHtml(name)}</span>
          <span class="msg-region-tag">${escapeHtml(prof.region)}</span>
        </div>
        <div class="working-row">
          <span class="typing-dots"><i></i><i></i><i></i></span>
          <span>正在执行…</span>
          <span class="working-timer tabular" data-start="${startedMs}">0s</span>
        </div>
      </div>
    `;
    stream.appendChild(el);
  });

  const updateTimers = () => {
    document.querySelectorAll('.working-timer').forEach(span => {
      const s = Number(span.dataset.start || Date.now());
      const sec = Math.max(0, Math.floor((Date.now() - s) / 1000));
      span.textContent = `${sec}s`;
    });
  };
  updateTimers();
  workingTickTimer = setInterval(updateTimers, 1000);
  if (nearBottom) container.scrollTop = container.scrollHeight;
}

function inferFallbackRole(sender) {
  if (sender === 'system') return 'system';
  const low = (sender || '').toLowerCase();
  if (sender === 'user' || sender === 'human' || low.startsWith('web-')) return 'human';
  if (low.includes('antigravity') || low.includes('codex') || low.includes('claude') || low.includes('cursor') || low.includes('local') || low.includes('mcp')) return 'mcp';
  return 'agent';
}

function showNewMsgPill() { document.getElementById('newMsgPill').classList.add('visible'); }
function hideNewMsgPill() { document.getElementById('newMsgPill').classList.remove('visible'); }
function scrollToBottom() {
  const container = document.getElementById('chatMessages');
  container.scrollTop = container.scrollHeight;
  hideNewMsgPill();
}

function appendMessage(msg, forceScroll = false) {
  const container = document.getElementById('chatMessages');
  const stream = document.getElementById('chatStream');
  const nearBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) < 85;

  const sender = msg.sender || 'unknown';
  const role = msg.role || inferFallbackRole(sender);
  const isSystem = role === 'system';
  const isHuman = role === 'human' || role === 'mcp';

  const firstWorking = stream.querySelector('.working-bubble');

  if (isSystem) {
    const div = document.createElement('div');
    div.className = 'message system';
    div.textContent = msg.content || '';
    if (firstWorking) stream.insertBefore(div, firstWorking);
    else stream.appendChild(div);
  } else {
    const prof = getNodeProfile(sender, role);
    const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const wrap = document.createElement('div');
    wrap.className = `message ${isHuman ? 'human' : 'agent'}`;
    wrap.style.setProperty('--node-color', prof.color);
    wrap.style.setProperty('--node-bg', prof.bg);
    wrap.style.setProperty('--node-border', prof.border);
    wrap._rawContent = msg.content || '';

    wrap.innerHTML = `
      <div class="msg-avatar">${escapeHtml(prof.mono)}</div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="msg-sender">${escapeHtml(sender)}</span>
          <span class="msg-region-tag">${escapeHtml(prof.region)}</span>
          <button type="button" class="msg-copy-btn" onclick="copyMessage(this)">复制</button>
          <span class="msg-time tabular">${escapeHtml(timeStr)}</span>
        </div>
        <div class="msg-body">${formatContent(msg.content || '')}</div>
      </div>
    `;
    if (firstWorking) stream.insertBefore(wrap, firstWorking);
    else stream.appendChild(wrap);

    const bodyEl = wrap.querySelector('.msg-body');
    if (bodyEl && bodyEl.scrollHeight > 420) {
      bodyEl.classList.add('collapsed');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'collapse-btn';
      btn.textContent = '展开全文';
      btn.onclick = () => {
        const collapsed = bodyEl.classList.toggle('collapsed');
        btn.textContent = collapsed ? '展开全文' : '收起';
      };
      wrap.querySelector('.msg-content').appendChild(btn);
    }
  }

  if (forceScroll || nearBottom) {
    container.scrollTop = container.scrollHeight;
    hideNewMsgPill();
  } else {
    showNewMsgPill();
  }
}

function copyText(text, okMsg = '已复制到剪贴板') {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('info', okMsg)).catch(() => fallbackCopy(text, okMsg));
  } else {
    fallbackCopy(text, okMsg);
  }
}

function fallbackCopy(text, okMsg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('info', okMsg); } catch (e) {}
  ta.remove();
}

function copyMessage(btn) {
  const wrap = btn.closest('.message');
  if (wrap) copyText(wrap._rawContent || '', '已复制消息原文');
}

function copyCodeBlock(btn) {
  const code = btn.closest('.code-block')?.querySelector('pre code')?.textContent || '';
  copyText(code, '已复制代码');
  btn.textContent = '已复制';
  setTimeout(() => { btn.textContent = '复制'; }, 1400);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(str) {
  return String(str).replace(/[^A-Za-z0-9_-]/g, '');
}

function mentionStyle(name) {
  const p = (typeof getNodeProfile === 'function')
    ? getNodeProfile(name, 'agent')
    : { color: '#2dd4bf', bg: 'rgba(45, 212, 191, 0.14)' };
  return `--mention-color:${p.color};--mention-bg:${p.bg};`;
}

function formatContent(raw) {
  const cleanRaw = String(raw || '').replace(/\x00/g, '');
  let text = escapeHtml(cleanRaw);
  const codeSlots = [];
  const stashCode = (rendered, isBlock = false) => {
    const idx = codeSlots.length;
    codeSlots.push(rendered);
    return isBlock ? `\n\x00CB_${idx}\x00\n` : `\x00IC_${idx}\x00`;
  };

  text = text.replace(/```(?:([A-Za-z0-9_.+-]+)[ \t]*\r?\n|\r?\n)?([\s\S]*?)```/g, (_, lang, code) => {
    const label = lang ? escapeHtml(lang) : 'code';
    const trimmed = String(code || '').replace(/\r?\n$/, '');
    const blockHtml = `<div class="code-block"><div class="code-head"><span class="code-lang">${label}</span><button type="button" class="copy-code-btn" onclick="copyCodeBlock(this)">复制</button></div><pre><code>${trimmed}</code></pre></div>`;
    return stashCode(blockHtml, true);
  });

  text = text.replace(/`([^`\n]+)`/g, (_, code) => {
    return stashCode(`<code class="inline-code">${code}</code>`, false);
  });

  const renderInline = (line) => {
    const linkSlots = [];
    const stashLink = (aHtml) => {
      const idx = linkSlots.length;
      linkSlots.push(aHtml);
      return `\x00LK_${idx}\x00`;
    };
    let s = line;
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
      return stashLink(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
    });
    s = s.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
      return stashLink(`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    s = s.replace(/(^|[^A-Za-z0-9_.-])@([A-Za-z0-9_][\w-]*)/g, (_, pre, name) => {
      return `${pre}<span class="mention" style="${mentionStyle(name)}">@${name}</span>`;
    });
    s = s.replace(/\x00LK_(\d+)\x00/g, (_, idx) => linkSlots[Number(idx)] || '');
    return s;
  };

  const lines = text.split(/\r?\n/);
  const out = [];
  let i = 0;

  const isTableSep = (ln) => /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(ln) && ln.includes('-');
  const parseTableRow = (ln) => {
    let row = ln.trim();
    if (row.startsWith('|')) row = row.slice(1);
    if (row.endsWith('|')) row = row.slice(0, -1);
    return row.split('|').map(c => c.trim());
  };

  while (i < lines.length) {
    const ln = lines[i];
    const trimmed = ln.trim();

    if (!trimmed) { i++; continue; }

    const cbMatch = trimmed.match(/^\x00CB_(\d+)\x00$/);
    if (cbMatch) {
      out.push(codeSlots[Number(cbMatch[1])] || '');
      i++;
      continue;
    }

    const hMatch = trimmed.match(/^(#{1,3})\s+(.+)$/);
    if (hMatch) {
      const level = Math.min(5, hMatch[1].length + 2);
      out.push(`<h${level} class="md-h">${renderInline(hMatch[2])}</h${level}>`);
      i++;
      continue;
    }

    if (ln.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headers = parseTableRow(ln);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
        rows.push(parseTableRow(lines[i]));
        i++;
      }
      const th = headers.map(c => `<th>${renderInline(c)}</th>`).join('');
      const tb = rows.map(r => `<tr>${headers.map((_, idx) => `<td>${renderInline(r[idx] || '')}</td>`).join('')}</tr>`).join('');
      out.push(`<div class="md-table-wrap"><table class="md-table"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`);
      continue;
    }

    if (trimmed.startsWith('&gt;')) {
      const qLines = [];
      while (i < lines.length && lines[i].trim().startsWith('&gt;')) {
        qLines.push(renderInline(lines[i].trim().replace(/^&gt;\s?/, '')));
        i++;
      }
      out.push(`<blockquote>${qLines.join('<br>')}</blockquote>`);
      continue;
    }

    if (/^\s*[-*•]\s+/.test(ln)) {
      const items = [];
      while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
        items.push(`<li>${renderInline(lines[i].replace(/^\s*[-*•]\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ul class="md-list">${items.join('')}</ul>`);
      continue;
    }

    if (/^\s*\d+\.\s+/.test(ln)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(`<li>${renderInline(lines[i].replace(/^\s*\d+\.\s+/, ''))}</li>`);
        i++;
      }
      out.push(`<ol class="md-list">${items.join('')}</ol>`);
      continue;
    }

    const pLines = [];
    while (i < lines.length) {
      const cur = lines[i];
      const ct = cur.trim();
      if (!ct || /^\x00CB_\d+\x00$/.test(ct) || /^(#{1,3})\s+/.test(ct) || ct.startsWith('&gt;') || /^\s*[-*•]\s+/.test(cur) || /^\s*\d+\.\s+/.test(cur) || (cur.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        break;
      }
      pLines.push(renderInline(cur));
      i++;
    }
    if (pLines.length) {
      out.push(`<p class="md-p">${pLines.join('<br>')}</p>`);
    }
  }

  let html = out.join('');
  html = html.replace(/\x00(?:CB|IC)_(\d+)\x00/g, (_, idx) => codeSlots[Number(idx)] || '');
  return html;
}

function insertMention(name) {
  const input = document.getElementById('msgInput');
  const prefix = input.value && !input.value.endsWith(' ') ? ' ' : '';
  input.value += `${prefix}@${name} `;
  input.focus();
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

  if (!currentThread) {
    pendingNewThreadFromSelf = true;
  }
  ws.send(JSON.stringify({
    type: 'message',
    sender: senderName,
    content: content,
    thread_id: currentThread
  }));
  input.value = '';
  input.style.height = 'auto';
  hideMentionDropdown();
}

function handleInputKey(e) {
  const dropdown = document.getElementById('mentionDropdown');
  if (dropdown.classList.contains('visible')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      navigateMention(e.key === 'ArrowDown' ? 1 : -1);
      return;
    }
    if (e.key === 'Enter' || e.key === 'Tab') {
      const sel = dropdown.querySelector('.mention-option.selected') || dropdown.querySelector('.mention-option');
      if (sel) {
        e.preventDefault();
        sel.click();
        return;
      }
    }
    if (e.key === 'Escape') {
      hideMentionDropdown();
      return;
    }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function getCaretLeftOffset(textarea, pos) {
  const mirror = document.createElement('span');
  const cs = getComputedStyle(textarea);
  mirror.style.font = cs.font;
  mirror.style.letterSpacing = cs.letterSpacing;
  mirror.style.whiteSpace = 'pre';
  mirror.style.visibility = 'hidden';
  mirror.style.position = 'fixed';
  const lineStart = textarea.value.lastIndexOf('\n', pos - 1) + 1;
  mirror.textContent = textarea.value.slice(lineStart, pos);
  document.body.appendChild(mirror);
  const w = mirror.getBoundingClientRect().width;
  mirror.remove();
  const maxLeft = Math.max(0, textarea.clientWidth - 235);
  return Math.min(maxLeft, Math.max(0, w));
}

function handleMentionInput(e) {
  const input = e.target;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';

  const val = input.value;
  const pos = input.selectionStart;
  const before = val.slice(0, pos);
  const match = before.match(/(?:^|[^A-Za-z0-9_.-])@([A-Za-z0-9_-]*)$/);
  if (match) {
    const atIndex = before.lastIndexOf('@');
    mentionStartPos = atIndex;
    showMentionDropdown(match[1], getCaretLeftOffset(input, atIndex));
  } else {
    hideMentionDropdown();
  }
}

function showMentionDropdown(query = '', leftPx = 0) {
  const dropdown = document.getElementById('mentionDropdown');
  const names = sortAgentEntries()
    .map(([n]) => n)
    .filter(n => n.toLowerCase().includes(query.toLowerCase()));
  if (names.length === 0) {
    hideMentionDropdown();
    return;
  }
  dropdown.style.left = `${leftPx}px`;
  dropdown.innerHTML = names.map((name, i) => {
    const prof = getNodeProfile(name, 'agent');
    const info = agents[name] || {};
    return `
      <div class="mention-option ${i === 0 ? 'selected' : ''}" onclick="selectMention('${escapeAttr(name)}')">
        <span class="mo-left">
          <span class="topo-dot" style="background:${prof.color};"></span>
          <span>@${escapeHtml(name)}</span>
        </span>
        <span style="font-size:11px;color:${info.online ? 'var(--online)' : 'var(--text-dim)'}">${escapeHtml(prof.region)} · ${info.online ? '在线' : '离线'}</span>
      </div>
    `;
  }).join('');
  dropdown.classList.add('visible');
}

function hideMentionDropdown() {
  document.getElementById('mentionDropdown').classList.remove('visible');
  mentionStartPos = -1;
}

function selectMention(name) {
  const input = document.getElementById('msgInput');
  const pos = input.selectionStart;
  input.value = input.value.slice(0, mentionStartPos) + '@' + name + ' ' + input.value.slice(pos);
  input.focus();
  hideMentionDropdown();
}

function navigateMention(dir) {
  const dropdown = document.getElementById('mentionDropdown');
  const options = dropdown.querySelectorAll('.mention-option');
  if (!options.length) return;
  const cur = dropdown.querySelector('.selected');
  let idx = Array.from(options).indexOf(cur);
  idx = (idx + dir + options.length) % options.length;
  if (cur) cur.classList.remove('selected');
  options[idx].classList.add('selected');
}
</script>
