<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentLoom · 多节点协作控制台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #070a12;
  --surface: rgba(13, 18, 31, 0.86);
  --surface-solid: #0f1524;
  --surface2: #161f33;
  --surface3: #1c2740;
  --primary: #2dd4bf;
  --primary-solid: #14b8a6;
  --primary-dim: rgba(45, 212, 191, 0.14);
  --text: #e6edf5;
  --text-soft: #b8c4d4;
  --text-dim: #7c8aa0;
  --border: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);
  --highlight: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --online: #22c55e;
  --offline: #ef4444;
  --warn: #f59e0b;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 65% 45% at 88% -8%, rgba(45, 212, 191, 0.085), transparent),
    radial-gradient(ellipse 55% 45% at 8% 108%, rgba(129, 140, 248, 0.085), transparent),
    radial-gradient(rgba(148, 163, 184, 0.055) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 24px 24px;
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.tabular { font-variant-numeric: tabular-nums; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.18); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.32); }

.app { display: flex; height: 100vh; position: relative; }

/* Sidebar */
.sidebar {
  width: 308px;
  background: var(--surface);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 60;
}
.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(45, 212, 191, 0.24), rgba(129, 140, 248, 0.24));
  border: 1px solid rgba(45, 212, 191, 0.35);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}
.brand-text h1 { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; color: var(--text); }
.brand-text span { display: block; font-size: 10.5px; color: var(--text-dim); margin-top: 1px; }

.header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); transition: all 0.3s; }
.conn-dot.connected { background: var(--online); box-shadow: 0 0 10px rgba(34, 197, 94, 0.65); }

.icon-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11.5px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); border-color: var(--border-strong); }
.icon-btn.primary { background: var(--primary-dim); border-color: rgba(45, 212, 191, 0.35); color: var(--primary); }
.icon-btn.primary:hover { background: rgba(45, 212, 191, 0.22); }
.icon-btn.danger:hover { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; background: rgba(239, 68, 68, 0.12); }

.sidebar-section {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.section-head h2 {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 0.7px;
  font-weight: 600;
}

.agent-list { display: flex; flex-direction: column; gap: 6px; max-height: 205px; overflow-y: auto; }
.agent-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border);
  box-shadow: var(--highlight);
  cursor: pointer;
  transition: all 0.15s;
}
.agent-item:hover {
  background: rgba(255, 255, 255, 0.055);
  border-color: var(--node-border, var(--border-strong));
  transform: translateY(-1px);
}
.node-mini-avatar {
  width: 24px; height: 24px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: 0.02em;
  background: var(--node-bg, rgba(148,163,184,0.14));
  color: var(--node-color, var(--text));
  border: 1px solid var(--node-border, var(--border));
  flex-shrink: 0;
}
.agent-main { flex: 1; min-width: 0; }
.agent-name-row { display: flex; align-items: center; gap: 5px; }
.agent-name { font-size: 12.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-region { font-size: 10.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-pill {
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  font-weight: 500;
}
.agent-pill.online { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
.agent-pill.offline { background: rgba(239, 68, 68, 0.12); color: #f87171; }
.agent-pill.working { background: rgba(45, 212, 191, 0.16); color: var(--primary); }
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.agent-pill.working .pill-dot { animation: pulseDot 1.1s infinite ease-in-out; }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }

/* Threads Sidebar */
.threads-section { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: none; }
.search-box {
  width: 100%;
  background: rgba(7, 10, 18, 0.7);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 12px;
  margin-bottom: 8px;
  outline: none;
}
.search-box:focus { border-color: rgba(45, 212, 191, 0.45); }
.search-box::placeholder { color: var(--text-dim); }

.thread-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px; }
.thread-item {
  padding: 9px 10px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}
.thread-item:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--border); }
.thread-item.active {
  background: linear-gradient(135deg, rgba(45, 212, 191, 0.12), rgba(45, 212, 191, 0.04));
  border-color: rgba(45, 212, 191, 0.42);
  box-shadow: var(--highlight);
}
.thread-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.thread-dots { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.t-dot { width: 6px; height: 6px; border-radius: 50%; }
.thread-topic { font-size: 12.5px; font-weight: 550; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.thread-time { font-size: 10.5px; color: var(--text-dim); flex-shrink: 0; }
.thread-unread {
  background: var(--primary);
  color: #042f2e;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  flex-shrink: 0;
}
.thread-preview-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.thread-preview { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.badge-tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; flex-shrink: 0; font-weight: 600; }
.badge-tag.closed { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
.badge-tag.working { background: rgba(45, 212, 191, 0.14); color: var(--primary); }

.stats-bar {
  padding: 9px 14px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.sender-pill {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-soft);
  font-size: 11px;
  max-width: 155px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sender-pill:hover { border-color: var(--primary); color: var(--text); }

/* Main Column */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* Topology Strip */
.topology-strip {
  height: 46px;
  padding: 0 14px;
  background: rgba(11, 15, 26, 0.78);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.topology-strip::-webkit-scrollbar { display: none; }
.topo-node {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-soft);
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.18s;
  flex-shrink: 0;
}
.topo-node:hover { border-color: var(--node-border, var(--border-strong)); color: var(--text); background: rgba(255,255,255,0.06); }
.topo-node.hub { border-color: rgba(45, 212, 191, 0.32); background: rgba(45, 212, 191, 0.08); color: var(--primary); font-weight: 600; }
.topo-node.offline { opacity: 0.48; }
.topo-node.active-pulse {
  border-color: var(--node-color, var(--primary));
  box-shadow: 0 0 14px var(--node-bg, rgba(45, 212, 191, 0.3));
  color: var(--text);
}
.topo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--node-color, var(--online)); }
.topo-node.offline .topo-dot { background: var(--offline); }

.topo-wire {
  width: 14px;
  height: 2px;
  background: rgba(148, 163, 184, 0.22);
  border-radius: 99px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.topo-wire.pulsing { background: rgba(45, 212, 191, 0.35); }
.topo-wire.pulsing::after {
  content: '';
  position: absolute;
  top: -1px; left: -10px;
  width: 10px; height: 4px;
  border-radius: 99px;
  background: var(--wire-color, var(--primary));
  box-shadow: 0 0 8px var(--wire-color, var(--primary));
  animation: wireFlow 0.9s linear infinite;
}
@keyframes wireFlow { from { left: -10px; } to { left: 16px; } }
.topo-fanout { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }

/* Disconnect Banner */
.conn-banner {
  display: none;
  padding: 8px 18px;
  background: rgba(239, 68, 68, 0.16);
  border-bottom: 1px solid rgba(239, 68, 68, 0.35);
  color: #fecaca;
  font-size: 12.5px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.conn-banner.visible { display: flex; }

/* Chat Header */
.chat-header {
  padding: 12px 20px;
  background: rgba(13, 18, 31, 0.65);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  flex-shrink: 0;
}
.chat-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.menu-btn { display: none; padding: 6px 9px; font-size: 14px; }
.title-wrap { min-width: 0; flex: 1; }
.title-row { display: flex; align-items: center; gap: 8px; }
.chat-header h2 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.rename-trigger {
  background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; padding: 2px 5px; border-radius: 4px; display: none;
}
.rename-trigger:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.rename-input {
  background: var(--bg);
  border: 1px solid var(--primary);
  border-radius: 6px;
  color: var(--text);
  font-size: 14px;
  padding: 3px 8px;
  width: 320px;
  max-width: 100%;
  outline: none;
}
.header-sub { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.participant-stack { display: inline-flex; align-items: center; gap: 4px; }
.p-chip {
  font-size: 10.5px; font-weight: 600;
  padding: 1px 7px; border-radius: 99px;
  background: var(--node-bg, rgba(148,163,184,0.12));
  color: var(--node-color, var(--text-soft));
  border: 1px solid var(--node-border, var(--border));
}
.status-chip { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.status-chip.open { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
.status-chip.closed { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
.sub-hint { font-size: 11.5px; color: var(--text-dim); }

.chat-header-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }

/* Thread Details Popover */
.info-popover {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 20px;
  width: 320px;
  max-width: calc(100vw - 32px);
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 14px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  z-index: 40;
  font-size: 12px;
}
.info-popover.visible { display: block; }
.pop-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.pop-row:last-child { border-bottom: none; }
.pop-label { color: var(--text-dim); }
.pop-val { color: var(--text-soft); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.round-bar { height: 5px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.round-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.25s; }

/* Messages Area */
.chat-messages { flex: 1; overflow-y: auto; padding: 22px 20px 26px; }
.chat-stream {
  max-width: 780px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Home Dashboard */
.dashboard { display: flex; flex-direction: column; gap: 18px; padding: 8px 0 12px; }
.dash-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 16px 18px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(45, 212, 191, 0.09), rgba(129, 140, 248, 0.07));
  border: 1px solid var(--border);
  box-shadow: var(--highlight);
}
.dash-hero h3 { font-size: 16px; font-weight: 650; color: var(--text); }
.dash-hero p { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
.dash-summary-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.sum-pill {
  font-size: 11.5px;
  padding: 5px 10px;
  border-radius: 99px;
  background: rgba(7, 10, 18, 0.55);
  border: 1px solid var(--border);
  color: var(--text-soft);
}

.node-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
}
.node-card {
  background: rgba(15, 21, 36, 0.85);
  border: 1px solid var(--border);
  border-top: 2px solid var(--node-color, var(--primary));
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--highlight);
  transition: transform 0.16s, border-color 0.16s;
}
.node-card:hover { transform: translateY(-2px); border-color: var(--node-border, var(--border-strong)); }
.nc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nc-id { display: flex; align-items: center; gap: 9px; min-width: 0; }
.nc-title { font-size: 13.5px; font-weight: 650; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nc-region { font-size: 11px; color: var(--text-dim); }
.nc-stats {
  display: grid;
  grid-template-columns: 1.35fr 0.8fr 1fr;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(7, 10, 18, 0.5);
  border: 1px solid var(--border);
  font-size: 11px;
}
.nc-stats > div { min-width: 0; }
.nc-stats > div span { display: block; color: var(--text-dim); font-size: 10px; white-space: nowrap; }
.nc-stats > div strong { color: var(--text-soft); font-size: 12px; margin-top: 2px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nc-caps { display: flex; flex-wrap: wrap; gap: 4px; }
.cap-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.nc-actions { display: flex; gap: 6px; }
.nc-btn {
  flex: 1;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 5px 6px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.nc-btn:hover { background: rgba(255, 255, 255, 0.09); color: var(--text); border-color: var(--border-strong); }
.nc-btn.accent { color: var(--node-color, var(--primary)); border-color: var(--node-border, var(--border)); background: var(--node-bg, transparent); }

.tpl-section h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 8px; }
.tpl-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tpl-chip {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border);
  color: var(--text-soft);
  padding: 7px 12px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.tpl-chip:hover { background: var(--primary-dim); border-color: rgba(45, 212, 191, 0.4); color: var(--primary); }

/* Chat Bubbles */
.message { display: flex; gap: 11px; max-width: 88%; animation: fadeIn 0.18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.message.system {
  align-self: center;
  max-width: 92%;
  font-size: 11.5px;
  color: var(--text-dim);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 99px;
}
.message.human { align-self: flex-end; flex-direction: row-reverse; }
.message.agent { align-self: flex-start; }

.msg-avatar {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
  background: var(--node-bg, rgba(148,163,184,0.14));
  color: var(--node-color, var(--text));
  border: 1px solid var(--node-border, var(--border));
  margin-top: 2px;
}

.msg-content {
  background: rgba(19, 25, 42, 0.88);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  min-width: 0;
  word-break: break-word;
  box-shadow: var(--highlight);
  position: relative;
}
.message.agent .msg-content { border-left: 3px solid var(--node-color, var(--primary)); }
.message.human .msg-content {
  background: rgba(22, 42, 74, 0.82);
  border-color: rgba(96, 165, 250, 0.3);
  border-right: 3px solid var(--node-color, #60a5fa);
}

.msg-header { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-size: 11.5px; }
.msg-sender { font-weight: 650; color: var(--node-color, var(--primary)); }
.msg-region-tag {
  font-size: 10px; padding: 1px 6px; border-radius: 4px;
  background: rgba(255, 255, 255, 0.05); color: var(--text-dim);
}
.msg-time { color: var(--text-dim); font-size: 10.5px; margin-left: auto; }
.msg-copy-btn {
  opacity: 0;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.msg-content:hover .msg-copy-btn { opacity: 1; }
.msg-copy-btn:hover { color: var(--text); border-color: var(--border-strong); }

/* Markdown Body */
.msg-body { font-size: 13.5px; line-height: 1.65; color: var(--text); position: relative; }
.msg-body.collapsed { max-height: 360px; overflow: hidden; }
.msg-body.collapsed::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0; height: 56px;
  background: linear-gradient(transparent, rgba(19, 25, 42, 0.96));
  pointer-events: none;
}
.message.human .msg-body.collapsed::after {
  background: linear-gradient(transparent, rgba(22, 42, 74, 0.96));
}
.collapse-btn {
  margin-top: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--primary);
  font-size: 11.5px;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.collapse-btn:hover { background: var(--primary-dim); }

.msg-body .md-p { margin: 4px 0; }
.msg-body .md-p:first-child { margin-top: 0; }
.msg-body .md-p:last-child { margin-bottom: 0; }
.msg-body .md-h { font-weight: 650; color: #f8fafc; margin: 10px 0 4px; line-height: 1.35; }
.msg-body h3.md-h { font-size: 15.5px; }
.msg-body h4.md-h { font-size: 14.5px; }
.msg-body h5.md-h { font-size: 13.5px; }
.msg-body strong { color: #f8fafc; font-weight: 650; }
.msg-body em { color: #cbd5e1; font-style: italic; }
.msg-body del { color: var(--text-dim); text-decoration: line-through; }
.msg-body a { color: #38bdf8; text-decoration: underline; text-underline-offset: 2px; }
.msg-body a:hover { color: #7dd3fc; }
.msg-body blockquote {
  border-left: 3px solid rgba(148, 163, 184, 0.35);
  padding: 4px 10px;
  margin: 6px 0;
  color: var(--text-soft);
  background: rgba(255, 255, 255, 0.025);
  border-radius: 0 6px 6px 0;
}
.msg-body .md-list { margin: 6px 0 6px 20px; }
.msg-body .md-list li { margin: 2px 0; }
.msg-body code.inline-code {
  background: rgba(148, 163, 184, 0.14);
  border: 1px solid rgba(148, 163, 184, 0.16);
  padding: 1px 5px;
  border-radius: 5px;
  font-size: 12.2px;
  font-family: var(--mono);
  color: #e2e8f0;
}

.code-block {
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #060911;
  overflow: hidden;
}
.code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  background: rgba(255, 255, 255, 0.035);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--mono);
}
.copy-code-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  color: var(--text-soft);
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-family: inherit;
}
.copy-code-btn:hover { color: var(--text); border-color: var(--primary); }
.code-block pre {
  padding: 10px 12px;
  overflow-x: auto;
  font-size: 12.2px;
  line-height: 1.5;
  font-family: var(--mono);
  color: #dbeafe;
  margin: 0;
}

.md-table-wrap { overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; }
.md-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.md-table th, .md-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.md-table th { background: rgba(255, 255, 255, 0.04); color: var(--text); font-weight: 600; }
.md-table tr:last-child td { border-bottom: none; }

.mention {
  color: var(--mention-color, #2dd4bf);
  background: var(--mention-bg, rgba(45, 212, 191, 0.14));
  font-weight: 600;
  padding: 0 5px;
  border-radius: 4px;
}

/* Working Placeholder Bubble */
.working-bubble .msg-content {
  background: rgba(19, 25, 42, 0.65);
  border-style: dashed;
  border-left: 3px solid var(--node-color, var(--primary));
}
.working-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); }
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots i {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--node-color, var(--primary));
  animation: bounceDot 1.2s infinite ease-in-out;
}
.typing-dots i:nth-child(2) { animation-delay: 0.2s; }
.typing-dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounceDot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }

/* Floating New Message Pill */
.new-msg-pill {
  display: none;
  position: absolute;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary);
  color: #042f2e;
  border: none;
  border-radius: 99px;
  padding: 6px 15px;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  z-index: 20;
}
.new-msg-pill.visible { display: inline-block; }

/* Composer */
.input-wrap {
  position: relative;
  padding: 12px 20px 14px;
  background: rgba(13, 18, 31, 0.84);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.composer-inner { max-width: 780px; margin: 0 auto; position: relative; }
.mention-dropdown {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  left: 0;
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  min-width: 230px;
  max-height: 200px;
  overflow-y: auto;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  z-index: 30;
  padding: 4px;
}
.mention-dropdown.visible { display: block; }
.mention-option {
  padding: 7px 10px;
  border-radius: 7px;
  font-size: 12.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.mention-option:hover, .mention-option.selected { background: var(--primary-dim); color: var(--primary); }
.mo-left { display: flex; align-items: center; gap: 7px; }

.chat-input { display: flex; gap: 10px; align-items: flex-end; }
.chat-input textarea {
  flex: 1;
  background: rgba(7, 10, 18, 0.85);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 13px;
  font-size: 13.5px;
  font-family: inherit;
  line-height: 1.45;
  resize: none;
  min-height: 42px;
  max-height: 140px;
  outline: none;
  transition: border-color 0.15s;
}
.chat-input textarea:focus { border-color: var(--primary); }
.send-btn {
  background: linear-gradient(135deg, #2dd4bf, #14b8a6);
  color: #042f2e;
  border: none;
  border-radius: 10px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  height: 42px;
  flex-shrink: 0;
  transition: transform 0.1s, opacity 0.15s;
}
.send-btn:hover { opacity: 0.92; }
.send-btn:active { transform: scale(0.98); }

/* Modals & Toasts */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(4, 7, 15, 0.86);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-backdrop.hidden { display: none; }
.modal {
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 22px;
  width: 400px;
  max-width: 94vw;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
}
.modal.wide { width: 580px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.modal h3 { color: var(--primary); font-size: 16.5px; }
.modal p { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; line-height: 1.55; }
.modal code { background: var(--surface2); padding: 2px 5px; border-radius: 4px; color: var(--text-soft); font-family: var(--mono); font-size: 11.5px; }
.modal input, .modal select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  margin-bottom: 10px;
  outline: none;
}
.modal input:focus, .modal select:focus { border-color: var(--primary); }
.modal-err { color: #f87171; font-size: 12px; min-height: 18px; margin-bottom: 8px; }
.modal .full-btn { width: 100%; }

.form-grid { display: grid; grid-template-columns: 1.2fr 0.9fr; gap: 8px; }
.field-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.quick-nodes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.quick-node-btn {
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
  color: var(--text-soft); cursor: pointer;
}
.quick-node-btn:hover { border-color: var(--primary); color: var(--primary); }

.issued-box {
  background: rgba(45, 212, 191, 0.08);
  border: 1px solid rgba(45, 212, 191, 0.35);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 14px;
}
.issued-title { font-size: 12px; font-weight: 650; color: var(--primary); margin-bottom: 6px; }
.issued-pre {
  background: #060911; border: 1px solid var(--border); border-radius: 7px;
  padding: 8px 10px; font-family: var(--mono); font-size: 11px; color: #dbeafe;
  overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-bottom: 8px;
}
.issued-actions { display: flex; flex-wrap: wrap; gap: 6px; }

.token-table { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.token-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.025); border: 1px solid var(--border);
  font-size: 12px;
}
.token-meta { min-width: 0; flex: 1; }
.token-name { font-weight: 600; color: var(--text); }
.token-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 99px; font-weight: 650; margin-left: 5px;
}
.role-badge.admin { background: rgba(251, 191, 36, 0.16); color: #fbbf24; }
.role-badge.operator { background: rgba(45, 212, 191, 0.16); color: #2dd4bf; }
.role-badge.worker { background: rgba(129, 140, 248, 0.16); color: #818cf8; }

.toast-container {
  position: fixed; top: 16px; right: 16px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 120; pointer-events: none;
}
.toast {
  background: var(--surface-solid);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--primary);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 12.5px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  animation: fadeIn 0.18s ease;
}
.toast.error { border-left-color: var(--offline); color: #fecaca; }

.drawer-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.58); z-index: 50;
}
.drawer-backdrop.visible { display: block; }

@media (max-width: 960px) {
  .node-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 286px;
    transform: translateX(-100%);
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: inline-flex; }
  .node-grid { grid-template-columns: 1fr; }
  .chat-header { padding: 10px 14px; }
  .chat-messages { padding: 14px 12px 18px; }
  .input-wrap { padding: 10px 12px 12px; }
  .chat-input textarea { font-size: 13px; padding: 10px; }
  .message { max-width: 95%; }
  .msg-copy-btn { opacity: 0.85; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleSidebar(false)"></div>

<div class="modal-backdrop" id="authModal">
  <div class="modal">
    <h3>🔐 连接 AgentLoom 中枢</h3>
    <p>请输入管理员 Token（位于服务端 <code>./data/admin.token</code>）或受邀操作员 Token（<code>al_op_...</code>）进入控制台。</p>
    <input type="password" id="secretInput" placeholder="输入 Access Token..." autocomplete="off">
    <div class="modal-err" id="authErr"></div>
    <button class="send-btn full-btn" id="loginBtn" onclick="submitSecret()">验证并进入控制台</button>
  </div>
</div>

<div class="modal-backdrop hidden" id="tokenModal">
  <div class="modal wide">
    <div class="modal-head">
      <h3>🔑 凭证与邀请管理</h3>
      <button class="icon-btn" onclick="closeTokenModal()">关闭</button>
    </div>
    <p>签发独立 <code>operator</code> 凭证可直接生成 MCP 配置发给协作者；<code>worker</code> 凭证用于接入新远端节点。</p>

    <div class="form-grid">
      <div>
        <label class="field-label">凭证名称 / 协作者昵称</label>
        <input type="text" id="newTokName" placeholder="例如 alice-mcp 或 sg-vps-1">
      </div>
      <div>
        <label class="field-label">角色权限</label>
        <select id="newTokRole">
          <option value="operator">operator（协作 / MCP / Web）</option>
          <option value="worker">worker（远端节点接入）</option>
          <option value="admin">admin（完全控制权限）</option>
        </select>
      </div>
    </div>

    <label class="field-label">允许访问的节点白名单（逗号分隔，<code>*</code> 表示全部）</label>
    <input type="text" id="newTokAgents" value="*">
    <div class="quick-nodes" id="quickNodeChips"></div>

    <button class="send-btn full-btn" style="margin-bottom:14px;" onclick="createNewToken()">签发新凭证</button>

    <div id="issuedResult"></div>

    <div class="section-head" style="margin-top:4px;">
      <h2>已签发凭证</h2>
      <button class="icon-btn" onclick="loadTokens()">刷新</button>
    </div>
    <div class="token-table" id="tokenList">
      <div style="color:var(--text-dim);font-size:12px;">加载中...</div>
    </div>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand" onclick="startNewThread(); toggleSidebar(false);">
        <div class="brand-mark">◈</div>
        <div class="brand-text">
          <h1>AgentLoom</h1>
          <span>多节点协作织网</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="conn-dot" id="connStatus" title="WebSocket 连接状态"></div>
        <button class="icon-btn" id="tokensBtn" style="display:none;" onclick="openTokenModal()" title="管理凭证与邀请">🔑 凭证</button>
        <button class="icon-btn danger" onclick="logoutSecret()" title="退出并清除本地凭证">退出</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-head">
        <h2>远端节点 (点击 @)</h2>
      </div>
      <div class="agent-list" id="agentList">
        <div style="color:var(--text-dim);font-size:12px;">等待连接...</div>
      </div>
    </div>

    <div class="sidebar-section threads-section">
      <div class="section-head">
        <h2>协作线程</h2>
        <button class="icon-btn primary" onclick="startNewThread(); toggleSidebar(false);">+ 总览 / 新建</button>
      </div>
      <input type="text" class="search-box" id="threadSearch" placeholder="搜索会话主题或节点..." oninput="renderThreads()">
      <div class="thread-list" id="threadList">
        <div style="color:var(--text-dim);font-size:12px;">暂无会话</div>
      </div>
    </div>

    <div class="stats-bar tabular">
      <span id="latencyText">中枢 --ms</span>
      <button class="sender-pill" id="senderPill" onclick="editSenderName()" title="点击修改显示昵称">操作员: user</button>
    </div>
  </aside>

  <main class="main">
    <div class="topology-strip" id="topologyStrip">
      <div class="topo-node" onclick="editSenderName()">⚡ 本地</div>
      <div class="topo-wire" id="wire-hub"></div>
      <div class="topo-node hub" onclick="startNewThread()">◈ Hub</div>
      <div class="topo-fanout" id="topoNodes"></div>
    </div>

    <div class="conn-banner" id="connBanner">
      <span>⚠️ 与中枢连接中断，正在自动重连…</span>
      <button class="icon-btn" onclick="connectWS()">立即重连</button>
    </div>

    <header class="chat-header">
      <div class="chat-header-left">
        <button class="icon-btn menu-btn" onclick="toggleSidebar(true)" aria-label="打开侧栏">☰</button>
        <div class="title-wrap">
          <div class="title-row" id="titleRow">
            <h2 id="chatTitle">多节点协作总览</h2>
            <button class="rename-trigger" id="renameBtn" onclick="startRenameThread()" title="重命名线程">✎</button>
          </div>
          <div class="header-sub" id="headerSub">
            <span class="sub-hint">选择下方快捷任务，或输入 @节点名 发起协作</span>
          </div>
        </div>
      </div>

      <div class="chat-header-right">
        <button class="icon-btn" id="infoBtn" style="display:none;" onclick="toggleInfoPopover()" title="线程详情">ⓘ 详情</button>
        <button class="icon-btn" id="toggleCloseBtn" style="display:none;" onclick="toggleThreadClosed()">关闭线程</button>
      </div>

      <div class="info-popover" id="infoPopover"></div>
    </header>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-stream" id="chatStream"></div>
    </div>

    <button class="new-msg-pill" id="newMsgPill" onclick="scrollToBottom()">↓ 有新消息</button>

    <div class="input-wrap">
      <div class="composer-inner">
        <div class="mention-dropdown" id="mentionDropdown"></div>
        <div class="chat-input">
          <textarea id="msgInput" rows="1" placeholder="输入指令… (@ 提及节点，Enter 发送)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const FALLBACK_PALETTE = [
  { color: '#818cf8', bg: 'rgba(129, 140, 248, 0.14)', border: 'rgba(129, 140, 248, 0.36)' },
  { color: '#fb7185', bg: 'rgba(251, 113, 133, 0.14)', border: 'rgba(251, 113, 133, 0.36)' },
  { color: '#fbbf24', bg: 'rgba(251, 191, 36, 0.14)',  border: 'rgba(251, 191, 36, 0.36)' },
  { color: '#38bdf8', bg: 'rgba(56, 189, 248, 0.14)',  border: 'rgba(56, 189, 248, 0.36)' },
  { color: '#c084fc', bg: 'rgba(192, 132, 252, 0.14)', border: 'rgba(192, 132, 252, 0.36)' },
  { color: '#34d399', bg: 'rgba(52, 211, 153, 0.14)',  border: 'rgba(52, 211, 153, 0.36)' }
];

let ws = null;
let heartbeatTimer = null;
let reconnectTimer = null;
let latencyTimer = null;
let workingTickTimer = null;
let relativeTimeTimer = null;
let token = localStorage.getItem('agentloom_token') || '';
let senderName = localStorage.getItem('agentloom_sender') || 'user';
let currentPrincipal = null;
var agents = {};
let threads = {};
let unreadCounts = {};
let currentThread = null;
let currentThreadData = null;
let currentThreadClosed = false;
let pendingNewThreadFromSelf = false;
let threadLoadSeq = 0;
let mentionStartPos = -1;
let hubLatencyMs = null;
let hubVersion = '0.1.0';
let pulseTimers = {};
let dynamicTemplates = [];
let lastIssuedRecord = null;
const clientId = 'web-ui-' + Math.random().toString(36).slice(2, 8);

document.addEventListener('DOMContentLoaded', () => {
  updateSenderPill();
  const input = document.getElementById('msgInput');
  input.addEventListener('keydown', handleInputKey);
  input.addEventListener('input', handleMentionInput);
  document.getElementById('secretInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitSecret();
  });

  const msgContainer = document.getElementById('chatMessages');
  msgContainer.addEventListener('scroll', () => {
    if ((msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight) < 40) {
      hideNewMsgPill();
    }
  });

  document.addEventListener('click', (e) => {
    const pop = document.getElementById('infoPopover');
    const btn = document.getElementById('infoBtn');
    if (pop.classList.contains('visible') && !pop.contains(e.target) && !btn.contains(e.target)) {
      pop.classList.remove('visible');
    }
  });

  renderDashboard();

  if (token) {
    verifyAndInit(token);
  } else {
    showAuthModal();
  }
});

function sanitizeColor(hex) {
  return /^#[0-9a-fA-F]{6}$/.test(String(hex || '').trim()) ? String(hex).trim() : '';
}

function hexToRgba(hex, alpha) {
  const clean = sanitizeColor(hex);
  if (!clean) return `rgba(45, 212, 191, ${alpha})`;
  const r = parseInt(clean.slice(1, 3), 16);
  const g = parseInt(clean.slice(3, 5), 16);
  const b = parseInt(clean.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function getNodeProfile(name, role = 'agent') {
  const low = (name || '').toLowerCase();
  if (role === 'mcp' || low.includes('antigravity') || low.includes('codex') || low.includes('claude') || low.includes('cursor') || low.includes('local')) {
    return { color: '#2dd4bf', bg: 'rgba(45, 212, 191, 0.14)', border: 'rgba(45, 212, 191, 0.36)', mono: 'AG', region: '本地 · MCP' };
  }
  if (role === 'human' || name === 'user' || name === 'human' || low.startsWith('web-')) {
    return { color: '#60a5fa', bg: 'rgba(96, 165, 250, 0.14)', border: 'rgba(96, 165, 250, 0.36)', mono: 'ME', region: '操作员' };
  }

  const meta = (agents[name] && agents[name].meta) || {};
  const customColor = sanitizeColor(meta.color);
  let pal;
  if (customColor) {
    pal = { color: customColor, bg: hexToRgba(customColor, 0.14), border: hexToRgba(customColor, 0.36) };
  } else {
    let hash = 0;
    for (let i = 0; i < low.length; i++) hash = ((hash << 5) - hash + low.charCodeAt(i)) | 0;
    pal = FALLBACK_PALETTE[Math.abs(hash) % FALLBACK_PALETTE.length];
  }

  const rawMono = (meta.mono || '').trim();
  const mono = rawMono ? rawMono.slice(0, 2).toUpperCase() : ((name || 'ND').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'ND');
  const region = meta.region || meta.backend || '远端节点';
  return { ...pal, mono, region };
}

  document.getElementById('secretInput').focus();
}

}

function logoutSecret() {
  localStorage.removeItem('agentloom_token');
  token = '';
  currentPrincipal = null;
  updateRoleUI();
  if (ws) { ws.close(); ws = null; }
  clearInterval(heartbeatTimer);
  clearTimeout(reconnectTimer);
  clearInterval(latencyTimer);
  clearInterval(relativeTimeTimer);
  document.getElementById('connBanner').classList.remove('visible');
  showAuthModal();
}

async function submitSecret() {
  const val = document.getElementById('secretInput').value.trim();
  if (!val) {
    document.getElementById('authErr').textContent = '请输入 Access Token';
    return;
  }
  await verifyAndInit(val);
}

async function verifyAndInit(candidate) {
  try {
    const resp = await fetch('/api/auth/whoami', {
      method: 'GET',
      headers: { 'X-Token': candidate }
    });
    if (!resp.ok) {
      localStorage.removeItem('agentloom_token');
      showAuthModal('Token 无效或无权访问控制台');
      return;
    }
    const info = await resp.json();
    token = candidate;
    currentPrincipal = info;
    if (!localStorage.getItem('agentloom_sender') && info.name && info.name !== 'admin') {
      senderName = info.name;
    }
    localStorage.setItem('agentloom_token', token);
    hideAuthModal();
    updateRoleUI();
    await Promise.all([fetchAgents(), fetchThreads(), measureLatency()]);
    connectWS();
    startTimers();
  } catch (e) {
    showAuthModal('无法连接服务器：' + e.message);
  }
}

function startTimers() {
  clearInterval(latencyTimer);
  latencyTimer = setInterval(measureLatency, 30000);
  clearInterval(relativeTimeTimer);
  relativeTimeTimer = setInterval(() => {
    renderThreads();
    if (!currentThread) renderDashboard();
  }, 30000);
}

async function measureLatency() {
  const t0 = performance.now();
  try {
    const r = await fetch('/health', { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      hubVersion = data.version || hubVersion;
      hubLatencyMs = Math.round(performance.now() - t0);
      document.getElementById('latencyText').textContent = `中枢 ${hubLatencyMs}ms · v${hubVersion}`;
    }
  } catch (e) {
    document.getElementById('latencyText').textContent = `中枢 离线 · v${hubVersion}`;
  }
}

function apiFetch(path, opts = {}) {
  opts.headers = Object.assign({ 'X-Token': token }, opts.headers || {});
  return fetch(path, opts);
}

function connectWS() {
  clearTimeout(reconnectTimer);
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    ws.close();
  }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'register',
      agent_name: clientId,
      role: 'human',
      token: token
    }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'registered') {
      document.getElementById('connStatus').classList.add('connected');
      document.getElementById('connBanner').classList.remove('visible');
      if (msg.principal) {
        currentPrincipal = msg.principal;
        updateRoleUI();
      }
      if (msg.agents) {
        agents = msg.agents;
        renderAgents();
        renderTopology();
        if (!currentThread) renderDashboard();
      }
      startHeartbeat();
    } else if (msg.type === 'error') {
      showToast('error', msg.error || 'WebSocket 错误');
      const errLow = (msg.error || '').toLowerCase();
      if (errLow.includes('token') || errLow.includes('secret')) {
        logoutSecret();
      }
    } else if (msg.type === 'agents_update') {
      agents = msg.agents || {};
      renderAgents();
      renderTopology();
      if (!currentThread) renderDashboard();
      syncWorkingIndicator();
    } else if (msg.type === 'agent_status') {
      handleAgentStatus(msg);
    } else if (msg.type === 'thread_update') {
      handleThreadUpdate(msg.thread);
    } else if (msg.type === 'broadcast') {
      handleBroadcast(msg);
    }
  };

  ws.onclose = () => {
    document.getElementById('connStatus').classList.remove('connected');
    if (token) {
      document.getElementById('connBanner').classList.add('visible');
      reconnectTimer = setTimeout(connectWS, 3000);
    }
    clearInterval(heartbeatTimer);
  };
}

function startHeartbeat() {
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'heartbeat' }));
    }
  }, 25000);
}

async function fetchAgents() {
  try {
    const r = await apiFetch('/api/agents');
    if (r.ok) {
      agents = await r.json();
      renderAgents();
      renderTopology();
      if (!currentThread) renderDashboard();
    }
  } catch (e) {}
}

async function fetchThreads() {
  try {
    const r = await apiFetch('/api/threads');
    if (r.ok) {
      threads = await r.json();
      renderThreads();
      if (!currentThread) renderDashboard();
    }
  } catch (e) {}
}

function sortAgentEntries() {
  return Object.entries(agents).sort((a, b) => {
    const onlineDiff = (b[1].online ? 1 : 0) - (a[1].online ? 1 : 0);
    if (onlineDiff !== 0) return onlineDiff;
    return a[0].localeCompare(b[0]);
  });
}

function renderAgents() {
  const list = document.getElementById('agentList');
  const entries = sortAgentEntries();
  if (entries.length === 0) {
    list.innerHTML = '<div style="color:var(--text-dim);font-size:12px;">暂无可见节点</div>';
    return;
  }
  list.innerHTML = entries.map(([name, info]) => {
    const prof = getNodeProfile(name, 'agent');
    const isWorking = info.online && info.working;
    const pillCls = !info.online ? 'offline' : (isWorking ? 'working' : 'online');
    const pillText = !info.online ? '离线' : (isWorking ? '执行中' : '在线');
    return `
      <div class="agent-item" style="--node-color:${prof.color};--node-bg:${prof.bg};--node-border:${prof.border};" onclick="insertMention('${escapeAttr(name)}'); toggleSidebar(false);">
        <div class="node-mini-avatar">${escapeHtml(prof.mono)}</div>
        <div class="agent-main">
          <div class="agent-name-row">
            <span class="agent-name">${escapeHtml(name)}</span>
          </div>
          <div class="agent-region">${escapeHtml(prof.region)}</div>
        </div>
        <span class="agent-pill ${pillCls}"><i class="pill-dot"></i>${pillText}</span>
      </div>
    `;
  }).join('');
}

function renderTopology() {
  const wrap = document.getElementById('topoNodes');
  const entries = sortAgentEntries();
  if (entries.length === 0) {
    wrap.innerHTML = '<span style="font-size:11.5px;color:var(--text-dim);">等待节点接入…</span>';
    return;
  }
  wrap.innerHTML = entries.map(([name, info]) => {
    const prof = getNodeProfile(name, 'agent');
    const isWorking = !!(info.online && info.working);
    const pulsingCls = isWorking ? 'pulsing' : '';
    const activeCls = isWorking ? 'active-pulse' : '';
    return `
      <div class="topo-wire ${pulsingCls}" id="wire-${escapeAttr(name)}" style="--wire-color:${prof.color};"></div>
      <div class="topo-node ${info.online ? '' : 'offline'} ${activeCls}" id="topo-${escapeAttr(name)}"
           style="--node-color:${prof.color};--node-bg:${prof.bg};--node-border:${prof.border};"
           onclick="insertMention('${escapeAttr(name)}')" title="点击 @${escapeAttr(name)}">
        <span class="topo-dot"></span>
        <span>${escapeHtml(name)}</span>
      </div>
    `;
  }).join('');
}

function pulseNodeLink(name, color) {
  const hubWire = document.getElementById('wire-hub');
  if (hubWire) {
    hubWire.style.setProperty('--wire-color', color || '#2dd4bf');
    hubWire.classList.add('pulsing');
  }
  const wire = document.getElementById(`wire-${escapeAttr(name)}`);
  const node = document.getElementById(`topo-${escapeAttr(name)}`);
  if (wire) wire.classList.add('pulsing');
  if (node) node.classList.add('active-pulse');

  clearTimeout(pulseTimers[name]);
  pulseTimers[name] = setTimeout(() => {
    const isWorking = agents[name]?.online && agents[name]?.working;
    if (!isWorking) {
      if (wire) wire.classList.remove('pulsing');
      if (node) node.classList.remove('active-pulse');
    }
    const anyWorking = Object.values(agents).some(a => a.online && a.working);
    if (!anyWorking && hubWire) hubWire.classList.remove('pulsing');
  }, 1800);
}

function formatRelativeTime(isoStr) {
  if (!isoStr) return '';
  const diff = Math.max(0, Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000));
  if (diff < 45) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
  return `${Math.floor(diff / 86400)} 天前`;
}

function stripMarkdownPreview(raw) {
  return String(raw || '')
    .replace(/```[\s\S]*?```/g, '[代码块]')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/^#+\s+/gm, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function isThreadWorking(tid) {
  return Object.values(agents).some(a => a.online && a.working && a.working.thread_id === tid);
}

function renderThreads() {
  const list = document.getElementById('threadList');
  const query = (document.getElementById('threadSearch').value || '').trim().toLowerCase();
  let entries = Object.values(threads).sort((a, b) =>
    (b.last_activity || '').localeCompare(a.last_activity || '')
  );
  if (query) {
    entries = entries.filter(t => {
      const hay = `${t.topic || ''} ${(t.participants || []).join(' ')} ${t.last_message?.preview || ''}`.toLowerCase();
      return hay.includes(query);
    });
  }
  if (entries.length === 0) {
    list.innerHTML = `<div style="color:var(--text-dim);font-size:12px;padding:6px 2px;">${query ? '没有匹配的会话' : '暂无会话'}</div>`;
    return;
  }
  list.innerHTML = entries.map(t => {
    const unread = unreadCounts[t.id] || 0;
    const working = isThreadWorking(t.id);
    const agentParticipants = (t.participants || []).filter(p => agents[p]);
    const dotsHtml = agentParticipants.map(p => {
      const prof = getNodeProfile(p, 'agent');
      return `<span class="t-dot" style="background:${prof.color};" title="${escapeHtml(p)}"></span>`;
    }).join('');
    const lm = t.last_message;
    const previewText = lm
      ? `${lm.sender}: ${stripMarkdownPreview(lm.preview)}`
      : `${t.message_count || 0} 条消息`;
    const timeStr = formatRelativeTime(t.last_activity);
    return `
      <div class="thread-item ${t.id === currentThread ? 'active' : ''}" onclick="selectThread('${escapeAttr(t.id)}'); toggleSidebar(false);">
        <div class="thread-top">
          ${dotsHtml ? `<div class="thread-dots">${dotsHtml}</div>` : ''}
          <div class="thread-topic">${escapeHtml(t.topic || t.id)}</div>
          ${unread > 0 ? `<span class="thread-unread tabular">${unread}</span>` : `<span class="thread-time tabular">${escapeHtml(timeStr)}</span>`}
        </div>
        <div class="thread-preview-row">
          <span class="thread-preview">${escapeHtml(previewText)}</span>
          ${working ? '<span class="badge-tag working">执行中</span>' : (t.is_closed ? '<span class="badge-tag closed">已关闭</span>' : '')}
        </div>
      </div>
    `;
  }).join('');
}

function buildDynamicTemplates(entries) {
  const onlineNames = entries.filter(([, i]) => i.online).map(([n]) => n);
  const templates = [];
  if (onlineNames.length >= 2) {
    const mentions = onlineNames.map(n => `@${n}`).join(' ');
    templates.push({
      label: `🔍 全节点巡检 (${onlineNames.length})`,
      text: `${mentions} 请各自报告当前主机名、负载与可用磁盘空间（不要@其他人）。`
    });
  }
  onlineNames.slice(0, 4).forEach(name => {
    templates.push({
      label: `检查 ${name}`,
      text: `@${name} 请检查当前服务状态、资源占用及最近日志。`
    });
  });
  return templates;
}

function renderDashboard() {
  if (currentThread) return;
  const stream = document.getElementById('chatStream');
  const entries = sortAgentEntries();
  const onlineCount = entries.filter(([, i]) => i.online).length;
  const threadCount = Object.keys(threads).length;
  const canControl = !!(currentPrincipal && currentPrincipal.can_control);

  const cardsHtml = entries.length === 0
    ? '<div style="color:var(--text-dim);font-size:13px;padding:24px;text-align:center;border:1px dashed var(--border);border-radius:12px;">等待 Worker 节点接入中枢… 可使用 <code>agentloom worker</code> 连接远端主机。</div>'
    : `<div class="node-grid">${entries.map(([name, info]) => {
        const prof = getNodeProfile(name, 'agent');
        const isWorking = info.online && info.working;
        const pillCls = !info.online ? 'offline' : (isWorking ? 'working' : 'online');
        const pillText = !info.online ? '离线' : (isWorking ? '执行中' : '在线');
        const backend = (info.meta && info.meta.backend) || 'agent';
        const caps = Array.isArray(info.meta?.capabilities) ? info.meta.capabilities.slice(0, 4) : [];
        const capsHtml = caps.length
          ? `<div class="nc-caps">${caps.map(c => `<span class="cap-tag">${escapeHtml(c)}</span>`).join('')}</div>`
          : '';
        const restartBtn = canControl
          ? `<button class="nc-btn" ${!info.online ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''} onclick="controlAgent('${escapeAttr(name)}', 'restart')">重启</button>`
          : '';
        return `
          <div class="node-card" style="--node-color:${prof.color};--node-bg:${prof.bg};--node-border:${prof.border};">
            <div class="nc-head">
              <div class="nc-id">
                <div class="node-mini-avatar" style="width:32px;height:32px;font-size:12px;">${escapeHtml(prof.mono)}</div>
                <div style="min-width:0;">
                  <div class="nc-title">${escapeHtml(name)}</div>
                  <div class="nc-region">${escapeHtml(prof.region)}</div>
                </div>
              </div>
              <span class="agent-pill ${pillCls}"><i class="pill-dot"></i>${pillText}</span>
            </div>
            <div class="nc-stats tabular">
              <div><span>适配器</span><strong>${escapeHtml(backend)}</strong></div>
              <div><span>回复数</span><strong>${info.total_replies ?? 0}</strong></div>
              <div><span>最近心跳</span><strong>${info.online ? `${info.last_seen_ago ?? 0}s 前` : '已断开'}</strong></div>
            </div>
            ${capsHtml}
            <div class="nc-actions">
              <button class="nc-btn accent" onclick="insertMention('${escapeAttr(name)}')">@ 派发任务</button>
              ${restartBtn}
            </div>
          </div>
        `;
      }).join('')}</div>`;

  dynamicTemplates = buildDynamicTemplates(entries);
  const tplHtml = dynamicTemplates.length
    ? dynamicTemplates.map((tpl, i) => `<button class="tpl-chip" onclick="useTemplate(${i})">${escapeHtml(tpl.label)}</button>`).join('')
    : '<span style="color:var(--text-dim);font-size:12px;">暂无在线节点，接入 Worker 后将自动生成快捷指令。</span>';

  stream.innerHTML = `
    <div class="dashboard">
      <div class="dash-hero">
        <div>
          <h3>AgentLoom 多节点协作总览</h3>
          <p>本地编码 Agent 与受控远端节点通过纯出站 WebSocket 协同执行任务。</p>
        </div>
        <div class="dash-summary-pills tabular">
          <span class="sum-pill">在线节点 ${onlineCount}/${entries.length}</span>
          <span class="sum-pill">协作线程 ${threadCount}</span>
        </div>
      </div>
      ${cardsHtml}
      <div class="tpl-section">
        <h4>快捷任务模板（点击填入输入框）</h4>
        <div class="tpl-row">${tplHtml}</div>
      </div>
    </div>
  `;
}

function useTemplate(idx) {
  const tpl = dynamicTemplates[idx];
  if (!tpl) return;
  const input = document.getElementById('msgInput');
  input.value = tpl.text;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  input.focus();
}

async function controlAgent(name, action) {
  try {
    const r = await apiFetch(`/api/agents/${encodeURIComponent(name)}/control`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action })
    });
    const data = await r.json();
    if (!r.ok) {
      showToast('error', `${name} 重启失败: ${data.detail || r.status}`);
      return;
    }
    showToast('info', `已向 ${name} 发送重启指令`);
    pulseNodeLink(name, getNodeProfile(name).color);
  } catch (e) {
    showToast('error', `请求失败: ${e.message}`);
  }
}
